name: Release binaries

on:
  push:
    branches:
      - nohara
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.27.1"
  TAILWIND_VERSION: "v4.2.4"
  TEMPL_VERSION: "v0.3.1001"
  ESBUILD_VERSION: "v0.28.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate templates
        run: go run github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }} generate --ignore-pattern='(^|/)dist(/|$)'

      - name: Build CSS
        run: |
          curl -fsSL -o /tmp/tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/${{ env.TAILWIND_VERSION }}/tailwindcss-linux-x64"
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -i ./assets/css/input.css -o ./assets/css/output.css --minify

      - name: Bundle JS
        run: >-
          go run github.com/evanw/esbuild/cmd/esbuild@${{ env.ESBUILD_VERSION }}
          $(ls assets/js/*.js | grep -v -e '\.min\.js$' -e '/sw\.js$')
          --minify --outdir=assets/min/js --log-level=warning

      - name: Build binaries
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -tags embedded_assets -trimpath \
              -ldflags "-X github.com/cristianadrielbraun/gofer/internal/buildinfo.Version=${version} -X github.com/cristianadrielbraun/gofer/internal/buildinfo.Commit=${GITHUB_SHA}" \
              -o "dist/gofer-linux-${arch}" .
            tar -C dist -czf "dist/gofer-linux-${arch}.tar.gz" "gofer-linux-${arch}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: gofer-linux
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
